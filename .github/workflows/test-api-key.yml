name: Test API Key (temporary)

on:
  workflow_dispatch:  # Manual trigger only — no schedule

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest

    steps:
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.10'

      - name: Install anthropic SDK
        run: pip install anthropic

      - name: Verify API key works
        env:
          ANTHROPIC_API_KEY: ${{ secrets.CLAUDE }}
        run: |
          python << 'EOF'
          import os, sys
          key = os.environ.get('ANTHROPIC_API_KEY', '')
          if not key:
              print('❌ FAIL: ANTHROPIC_API_KEY is empty — secrets.CLAUDE not set or wrong name')
              sys.exit(1)
          print(f'✓ Key is present (length={len(key)}, starts with {key[:7]}...)')

          import anthropic
          client = anthropic.Anthropic(api_key=key)

          # Make one cheap test call — no real data involved
          response = client.messages.create(
              model="claude-haiku-4-5-20251001",
              max_tokens=50,
              temperature=0,
              messages=[{
                  "role": "user",
                  "content": "Reply with exactly the word: PASS"
              }]
          )
          reply = response.content[0].text.strip()
          print(f'✓ API responded: "{reply}"')

          if 'PASS' in reply.upper():
              print('✓ API KEY IS VALID AND WORKING')
              sys.exit(0)
          else:
              print(f'⚠ Unexpected response — key works but reply was: {reply}')
              sys.exit(1)
          EOF
