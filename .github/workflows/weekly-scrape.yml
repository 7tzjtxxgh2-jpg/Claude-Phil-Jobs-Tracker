name: Weekly PhilJobs Scraper

on:
  schedule:
    # Runs every Monday at 9 AM Central Time (14:00 UTC during CDT, 15:00 UTC during CST)
    - cron: '0 14 * * 1'
  workflow_dispatch:  # Allows manual triggering

# All workflows that commit to main share one concurrency group so
# runs queue instead of racing each other's pushes (e.g. when the
# 15th falls on a Monday and this fires alongside the weekly scrape).
concurrency:
  group: repo-writer
  cancel-in-progress: false

permissions:
  contents: write
  issues: write

jobs:
  scrape:
    runs-on: ubuntu-latest
    # Opt in to Node 24 ahead of GitHub Actions' June 2026 cut-over. All
    # actions used here (checkout, setup-python, github-script) already
    # support Node 24 in their latest minor releases; this just switches
    # the runtime now so we catch any compatibility issues before the
    # forced migration and the Sept 2026 Node 20 removal.
    env:
      FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          token: ${{ secrets.GITHUB_TOKEN }}
          persist-credentials: true

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.10'

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install requests beautifulsoup4 anthropic

      - name: Run scraper
        env:
          ANTHROPIC_API_KEY: ${{ secrets.CLAUDE }}
        run: |
          python scraper.py

      - name: Commit and push updated data + dashboard
        run: |
          git config --local user.email "action@github.com"
          git config --local user.name "GitHub Action"
          git add data/ docs/
          git diff --staged --quiet || git commit -m "Weekly scrape: $(date +'%Y-%m-%d')"
          # Rebase onto any commits pushed since checkout (another workflow
          # may have won a race); retry once in case a push lands mid-rebase.
          git pull --rebase origin main
          git push || (git pull --rebase origin main && git push)

      - name: Notify on failure
        if: failure()
        uses: actions/github-script@v7
        with:
          script: |
            const date = new Date().toISOString().split('T')[0];
            const runUrl = `${context.serverUrl}/${context.repo.owner}/${context.repo.repo}/actions/runs/${context.runId}`;
            await github.rest.issues.create({
              owner: context.repo.owner,
              repo: context.repo.repo,
              title: `⚠️ Weekly scrape FAILED — ${date}`,
              body: `The weekly PhilJobs scrape failed and needs attention.\n\n**Date:** ${date}\n**Run:** [View logs](${runUrl})\n\nPlease check the logs for errors and re-run manually once the issue is resolved.`,
              labels: ['scrape-failure']
            });
