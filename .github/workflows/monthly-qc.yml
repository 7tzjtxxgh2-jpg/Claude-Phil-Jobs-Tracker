name: Monthly QC Check

on:
  schedule:
    # Runs on the 1st of every month at 10 AM UTC
    - cron: '0 10 1 * *'
  workflow_dispatch:  # Allows manual triggering

# All workflows that commit to main share one concurrency group so
# runs queue instead of racing each other's pushes (e.g. when the
# 15th falls on a Monday and this fires alongside the weekly scrape).
concurrency:
  group: repo-writer
  cancel-in-progress: false

permissions:
  contents: write
  issues: write

jobs:
  qc:
    runs-on: ubuntu-latest
    env:
      FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true  # see weekly-scrape.yml

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.10'

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install requests beautifulsoup4

      - name: Run QC check
        id: qc
        run: |
          python qc_check.py 2>&1 | tee qc_output.txt
          echo "exit_code=${PIPESTATUS[0]}" >> $GITHUB_OUTPUT

      - name: Commit QC report
        run: |
          git config --local user.email "action@github.com"
          git config --local user.name "GitHub Action"
          git add data/qc_report_*.md
          git diff --staged --quiet || git commit -m "Monthly QC report: $(date +'%Y-%m-%d')"
          # Rebase onto any commits pushed since checkout (another workflow
          # may have won a race); retry once in case a push lands mid-rebase.
          git pull --rebase origin main
          git push || (git pull --rebase origin main && git push)

      - name: Post QC report as GitHub Issue
        uses: actions/github-script@v7
        with:
          script: |
            const fs = require('fs');
            const output = fs.readFileSync('qc_output.txt', 'utf8');
            const date = new Date().toISOString().split('T')[0];
            const exitCode = '${{ steps.qc.outputs.exit_code }}';
            const status = exitCode === '0' ? '🟢 Passed' : '🔴 Errors Found';
            const runUrl = `${context.serverUrl}/${context.repo.owner}/${context.repo.repo}/actions/runs/${context.runId}`;

            await github.rest.issues.create({
              owner: context.repo.owner,
              repo: context.repo.repo,
              title: `📊 Monthly QC Report — ${date} — ${status}`,
              body: `Automated monthly quality control check.\n\n[View full run](${runUrl})\n\n---\n\n${output}`,
              labels: ['qc-report']
            });
